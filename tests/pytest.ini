[pytest]
# geo-dataset-readiness — pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Custom markers
markers =
    unit: Pure unit tests — no file I/O required
    integration: Integration tests — require test bases in tests/data/bases_teste/
    slow: Tests that take more than a few seconds (e.g. B11 performance base)
    linux: Tests specific to Linux environment

# Minimum version
minversion = 7.0
