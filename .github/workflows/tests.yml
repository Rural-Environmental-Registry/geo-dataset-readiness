name: Tests

# Runs on every push to develop and on every Pull Request targeting main.
# This ensures all tests pass before any code reaches the main branch.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests (no file I/O)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run unit tests
        run: |
          pytest tests/unit \
            -m unit \
            --tb=short \
            --cov=geo-dataset-readiness \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests (with test bases)
    runs-on: ubuntu-latest
    needs: unit-tests   # Only run integration tests if unit tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Generate test bases
        # Runs criar_bases_teste.py to produce B01–B12 in tests/data/bases_teste/
        # B02 (.gdb) may fail if OpenFileGDB write driver is unavailable — non-fatal.
        run: |
          python tests/data/criar_bases_teste.py || true
          echo "Test bases generated:"
          ls -lh tests/data/bases_teste/ || echo "(directory not found)"

      - name: Run integration tests
        run: |
          pytest tests/integration \
            -m integration \
            --tb=short \
            --cov=geo-dataset-readiness \
            --cov-report=xml \
            --cov-append \
            -v

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: integration
          fail_ci_if_error: false

  # Summary job — used as required status check in branch protection rules.
  # Requires both unit and integration tests to pass before merging to main.
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed."
            exit 1
          fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "Integration tests failed."
            exit 1
          fi
          echo "All tests passed."
